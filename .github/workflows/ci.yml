name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# Prevents multiple runs from the same PR overlapping
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Code Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install dependencies
              run: |
                  go version
                  make setup-ci

            - name: Run Linter
              run: make lint

            - name: Run Tests and Check Coverage
              run: make test-race-coverage

            - name: Run govulncheck
              uses: golang/govulncheck-action@v1

    models:
        name: Generated Models and API Examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            # Node.js, which the generators need, is on the runner already
            - name: Check that the guide's generated models compile
              run: make check-models

            - name: Check that the AsyncAPI and OpenAPI examples are valid
              run: make check-apis
