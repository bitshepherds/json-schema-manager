name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# Prevents multiple runs from the same PR overlapping
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Code Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            # The tools in mise.toml, at the versions used locally
            - name: Set up tools
              uses: jdx/mise-action@v5

            - name: Run Linter
              run: make lint

            - name: Check the GoReleaser configuration
              run: make release-check

            - name: Run Tests and Check Coverage
              run: make test-race-coverage

            - name: Run govulncheck
              uses: golang/govulncheck-action@v1

    models:
        name: Generated Models and API Examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            # The tools in mise.toml, at the versions used locally
            - name: Set up tools
              uses: jdx/mise-action@v5

            # bunx installs the pinned npm tools into Bun's cache; @asyncapi/cli alone is about
            # 2,700 packages, so keep the cache between runs. The pins are in the scripts.
            - name: Cache the npm tools
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-tools-${{ runner.os }}-${{ hashFiles('mise.toml', 'scripts/models/main.go', 'scripts/apis/main.go') }}
                  restore-keys: bun-tools-${{ runner.os }}-

            - name: Check that the guide's generated models compile
              run: make check-models

            - name: Check that the AsyncAPI and OpenAPI examples are valid
              run: make check-apis
