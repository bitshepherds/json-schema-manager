# Both versions are deployed, and a check fails on them. Neither can change, so the way out is an
# exception file, which may be added to a deployed version.
promise: declared-exception
validate:
  1.0.0: fail
  1.1.0: fail
checkChanges:
  deployed: [1.0.0, 1.1.0]
  overlays:
    add-exception-file:
      verdict: pass
