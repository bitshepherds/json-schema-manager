# An AsyncAPI document whose message payload is a JSM schema. The $ref points at the collapsed
# schema which 'jsm build-dist prod --collapse' writes, so tools resolve it without the network.
asyncapi: 3.1.0
info:
  title: Customer events
  version: 1.0.0
channels:
  customerRegistered:
    address: customer.registered
    messages:
      customerRegistered:
        $ref: '#/components/messages/customerRegistered'
operations:
  publishCustomerRegistered:
    action: send
    channel:
      $ref: '#/channels/customerRegistered'
components:
  messages:
    customerRegistered:
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: '../../dist/prod/private/domain-c_domain-c-a_customer_1_0_0.schema.json'
